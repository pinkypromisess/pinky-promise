openapi: 3.0.3
info:
  title: Pinky Promise API
  description: >
    Source-of-truth contract for the Pinky Promise backend, built by
    multiple parallel module owners against this shared file — each module
    only adds/extends its own paths and schemas here.


    **Module A: Profile & Verification.** Covers CUJ #1 (create profile),
    CUJ #2 (selfie verification), and CUJ #7 (edit profile).


    **Module B: Proposals & Feed.** Covers CUJ #1's proposal-specific
    fields, CUJ #3's browse/feed (not the swipe write endpoint — see
    `POST /proposals/{id}/swipe`'s note, owned by Module C), CUJ #8
    (delete), and CUJ #9 (recreate, which reuses `POST /proposals`).
  version: 0.2.0

servers:
  - url: https://api.pinkypromise.app/v1
    description: Production (Cloud Run)
  - url: http://localhost:8080/v1
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: Profile
  - name: Verification
  - name: Proposal
  - name: Conversation
  - name: PinkyPromise

paths:
  /profile:
    put:
      tags: [Profile]
      summary: Create or update the caller's profile
      description: >
        Upserts the authenticated user's Profile. Same endpoint serves both
        CUJ #1 (first-time create) and CUJ #7 (edit) — Profile is 1:1 with
        User, so there's no separate create-vs-edit distinction. This is a
        full-state upsert: `photo_urls` is always required and must contain
        at least 6 entries (send the current set unchanged if you're only
        editing other fields). Submitting a `photo_urls` array that differs
        from the currently stored set (by content or order) is treated the
        same as `PATCH /profile/photos` for verification purposes: it sets
        `verified = false`. Submitting the exact same set does not affect
        `verified`. To edit photos incrementally without resending the full
        list, use `PATCH /profile/photos` instead.
      operationId: putProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpsertRequest'
      responses:
        '200':
          description: Profile created or updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Validation failure (missing required field, or fewer than 6 photos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profile/photos:
    patch:
      tags: [Profile]
      summary: Add, replace, or remove photos on the caller's profile
      description: >
        Incremental photo edit. `remove` is applied before `add`. The
        resulting photo count must be >= 6 or the whole request is rejected
        and no change is persisted. On any successful change, `verified` is
        unconditionally set to `false` (per CUJ #7 — any photo mutation
        invalidates verification, since the original verification was scored
        against the prior photo set). A no-op request (empty `add` and
        `remove`) is rejected with 400 rather than silently succeeding.
      operationId: patchProfilePhotos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoPatchRequest'
      responses:
        '200':
          description: Photos updated; returns the full updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: >
            Resulting photo count would be below 6, `remove` referenced a
            photo id not on the profile, or the request was a no-op.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Caller has not created a profile yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /profile/photos/upload-url:
    post:
      tags: [Profile]
      summary: Get a signed URL to upload a profile photo directly to GCS
      description: >
        Returns a short-lived (~15 minute) signed URL the client PUTs the
        raw photo bytes to directly — the photo itself never transits this
        backend. The resulting GCS object path
        (`profile-photos/{user_id}/{uuid}.{ext}`) is entirely
        server-derived: `{user_id}` comes from the authenticated caller,
        `{uuid}` is freshly generated per call, and `{ext}` is looked up
        from `content_type` against a fixed allowlist — none of it is
        client-supplied. Once the client's PUT to `upload_url` succeeds,
        pass `object_url` to `PUT /profile` (in `photo_urls`) or
        `PATCH /profile/photos` (in `add`) to actually attach it to the
        profile; this endpoint only reserves the object path and a
        signature, it does not touch the Profile.


        Signed server-side using this Cloud Run service's own identity via
        the IAM Credentials API's `signBlob` method — no downloaded
        service account key is used or stored.
      operationId: createProfilePhotoUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoUploadUrlRequest'
      responses:
        '200':
          description: Signed upload URL created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoUploadUrlResponse'
        '400':
          description: content_type is missing or not one of the supported photo types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profile/me:
    get:
      tags: [Profile]
      summary: Get the caller's own profile
      description: >
        Always returns the full profile shape (including `occupation` and
        `relationship_status` regardless of any proposal's `revealed_fields`)
        since this is the owner viewing their own data, not a bare/proposal
        context view subject to CUJ #3's visibility rules.
      operationId: getMyProfile
      responses:
        '200':
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: Caller has not created a profile yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profile/{user_id}:
    get:
      tags: [Profile]
      summary: Bare profile view of another user (CUJ #4)
      description: >
        Returns only fields 1-5 (name, sex, age, need_to_know_text,
        photos) — never occupation, relationship_status, verified, or
        created_at. There is no Proposal context here, so no per-Proposal
        reveal applies; this is a strict subset of what's already shown to
        every browsing user on a Proposal card, so it introduces no new
        information disclosure. Added for Frontend Module 3 (Conversations)
        to identify the other participant.
      operationId: getUserProfile
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested user's bare profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileBareView'
        '404':
          description: No such user, or that user has no profile yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /verification:
    post:
      tags: [Verification]
      summary: Start a new verification attempt
      description: >
        Creates a new Verification attempt (`decision = pending`) for the
        caller and starts a liveness session with the verification vendor
        (e.g. AWS Rekognition Face Liveness). The mobile client uses the
        returned `liveness_session_id` with the vendor's client SDK to
        perform the actual in-app live capture — the capture itself does not
        transit this backend. Once the client finishes the capture, poll
        `GET /verification/status` to get the outcome: the server fetches the
        liveness session result from the vendor, runs CompareFaces against
        the caller's current profile photos, and finalizes `decision` based
        on a confidence threshold. Rejected with 400 if the caller's profile
        has fewer than 6 photos, since there is nothing to compare against.
      operationId: startVerification
      responses:
        '201':
          description: Verification attempt created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          description: Profile does not exist yet, or has fewer than 6 photos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /verification/status:
    get:
      tags: [Verification]
      summary: Get the status of the caller's most recent verification attempt
      description: >
        Returns the latest Verification row for the caller (a user can retry
        after a `fail`, so this is always the newest attempt, not a specific
        one by id). Intended for polling while `decision = pending`.
      operationId: getVerificationStatus
      responses:
        '200':
          description: Latest verification attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '404':
          description: Caller has never submitted a verification attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /proposals:
    post:
      tags: [Proposal]
      summary: Create a Proposal
      description: >
        Creates a Proposal for the caller (CUJ #1's proposal-specific
        fields, CUJ #3's posting gate). Rejected with 403 if the caller's
        Profile is missing, unverified (`verified = false`), or has fewer
        than 6 photos — verification and photo edits both live in Module A,
        but this endpoint independently enforces the gate at post time
        rather than trusting the `verified` flag alone, since photo count
        is a live minimum, not a one-time check. `revealed_fields` may only
        name fields the caller's profile actually has filled in (e.g.
        `occupation` is rejected with 400 if the caller never set an
        occupation) — this is the same visibility rule enforced on read by
        every feed/card response.
      operationId: createProposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalCreateRequest'
      responses:
        '201':
          description: Proposal created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          description: >
            Validation failure — missing/invalid field, or a
            `revealed_fields` entry the caller's profile doesn't have
            filled in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller's profile is missing, unverified, or has fewer than 6 photos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /proposals/feed:
    get:
      tags: [Proposal]
      summary: Browse active Proposals (CUJ #3)
      description: >
        Returns active Proposals for the caller to swipe through, excluding
        the caller's own. No verification is required to browse (per CUJ
        #2 — only Hearting and posting are gated). MVP ranking is distance
        + recency: pass `lat`/`lng` for the caller's current position to
        rank by distance ascending (recency as tiebreaker); omit both to
        rank by recency alone. Each item's `creator` profile is computed
        per that specific Proposal's `revealed_fields` — `occupation` and
        `relationship_status` are `null` unless the creator both filled
        them in and chose to reveal them on this Proposal.


        **Known gaps, flagged rather than silently built around:** this
        does not yet exclude proposals the caller has already swiped on
        (needs Module C's `swipes` table, which doesn't exist in this repo
        yet) or proposals from blocked/blocking creators (needs Module E's
        `blocks` table, also not landed yet). Both exclusions are marked
        with `TODO` comments at the exact join point in
        `ProposalService::getFeed` and should be wired in once those
        tables exist.
      operationId: getProposalsFeed
      parameters:
        - name: lat
          in: query
          required: false
          description: Caller's current latitude, for distance ranking. Must be paired with `lng`.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: false
          description: Caller's current longitude, for distance ranking. Must be paired with `lat`.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
      responses:
        '200':
          description: Feed page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalFeedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /proposals/{id}:
    delete:
      tags: [Proposal]
      summary: Delete (cancel) a Proposal
      description: >
        Creator-only. Allowed regardless of the Proposal's current status,
        including one with a confirmed Pinky Promise (CUJ #8). Sets
        `status = cancelled`.


        **Cascade not yet implemented:** per the entities doc, this should
        also close any open Conversations and cancel a confirmed
        PinkyPromise/reminder in the same transaction — those are Module
        C's tables/jobs and don't exist in this repo yet, so for now this
        endpoint only flips `Proposal.status`. Flagged with a `TODO`
        comment at the exact spot in `ProposalService::deleteProposal`.
      operationId: deleteProposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Proposal cancelled.
        '404':
          description: No such Proposal, or the caller isn't its creator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /proposals/{id}/swipe:
    post:
      tags: [Proposal]
      summary: Swipe (Heart / X) on a Proposal (CUJ #3)
      description: >
        Records the caller's swipe on Proposal `{id}` — `interested` is
        the Heart, `pass` is the X. One swipe per caller per Proposal,
        ever: a second swipe (even flipping `interested` <-> `pass`) is
        rejected with 409 `ALREADY_SWIPED`, never upserted.


        `pass` is always allowed (no verification, no cap). `interested`
        requires the caller's `Profile.verified = true` (else 403
        `PROFILE_NOT_VERIFIED`) and counts against the "10 interested per
        day" rule (CUJ #3 / Global rules), interpreted as a rolling 24h
        window — the 11th `interested` swipe inside any 24h span is
        rejected with 403 `INTERESTED_DAILY_CAP_REACHED` (a distinct code
        from the verification gate). `pass` swipes never count toward that
        cap.


        `{id}` must name an `active` Proposal owned by someone other than
        the caller: an unknown/malformed id or a
        cancelled/expired/pinky_promised Proposal returns 404, and swiping
        on your own Proposal returns 400 `CANNOT_SWIPE_OWN_PROPOSAL`.
      operationId: swipeOnProposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwipeRequest'
      responses:
        '201':
          description: Swipe recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Swipe'
        '400':
          description: >
            `action` missing/invalid, or the caller tried to swipe on
            their own Proposal (`CANNOT_SWIPE_OWN_PROPOSAL`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            `interested` swipe blocked — caller isn't verified
            (`PROFILE_NOT_VERIFIED`) or has hit the rolling-24h interested
            cap (`INTERESTED_DAILY_CAP_REACHED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such active Proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The caller has already swiped on this Proposal (`ALREADY_SWIPED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /conversations:
    get:
      tags: [Conversation]
      summary: List the caller's conversations (CUJ #4)
      description: >
        Every Conversation where the caller is the proposer (`A`) or the
        interested user (`B`), most-recent `last_activity_at` first. A
        Conversation is opened automatically when a user swipes
        `interested` on a Proposal (see `POST /proposals/{id}/swipe`);
        there is no endpoint to create one directly.


        Each item carries a server-**computed** `expires_at` (never a
        stored ticking value): 3 days from creation if `A` has not replied;
        otherwise 12h from `A`'s first reply, +1 minute per consecutive
        same-sender message and +2 hours each time the other side breaks
        silence, hard-capped at 3 days from creation. It is `null` once the
        Conversation is `pinky_promised`.
      operationId: listConversations
      responses:
        '200':
          description: The caller's conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /conversations/{id}:
    get:
      tags: [Conversation]
      summary: Get a single conversation
      description: >
        Returns the Conversation with its computed `expires_at` (see
        `GET /conversations`). 404 if no such Conversation (or a malformed
        id); 403 `NOT_A_PARTICIPANT` if the caller is neither `A` nor `B`.
      operationId: getConversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '403':
          description: The caller is not a participant (`NOT_A_PARTICIPANT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /conversations/{id}/messages:
    get:
      tags: [Conversation]
      summary: List a conversation's messages
      description: >
        All messages in the conversation, oldest first (`created_at`
        ASC). Same participant gate as GET /conversations/{id} (403
        `NOT_A_PARTICIPANT`, 404 for no such conversation). No expiry
        check — unlike posting, reading history is always allowed
        regardless of the conversation's computed status. Added for
        Frontend Module 3: C.2 originally shipped POST for this path but
        no way to read the history back.
      operationId: listConversationMessages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The conversation's messages, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '403':
          description: The caller is not a participant (`NOT_A_PARTICIPANT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Conversation]
      summary: Post a message to a conversation
      description: >
        Appends a text or voice message. The caller must be `A` or `B`
        (else 403 `NOT_A_PARTICIPANT`); 404 if the Conversation doesn't
        exist. Rejected with 409 `CONVERSATION_EXPIRED` when the
        Conversation's **computed** status is expired (now past its
        computed `expires_at`) -- a `pinky_promised` Conversation is never
        expired and always accepts messages. On success the message is
        stored and the Conversation's `last_activity_at` / `last_sender_id`
        are advanced to this message.
      operationId: postConversationMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '201':
          description: Message stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: '`type` missing/invalid, or `content` missing/blank.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not a participant (`NOT_A_PARTICIPANT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The conversation has expired (`CONVERSATION_EXPIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /conversations/{id}/pinky-promise:
    post:
      tags: [PinkyPromise]
      summary: Initiate a Pinky Promise on a conversation (A taps the button)
      description: >
        Only the conversation's proposer ("A") may call this. Creates a
        PinkyPromise in `pending_b_confirm` for `(proposal, A, B)` where B
        is the conversation's interested user. This does **not** stop the
        conversation's expiry clock -- per CUJ #4 the un-timed state kicks
        in only at `confirmed`, not at `pending_b_confirm`.


        The 3-concurrent cap is a confirm-time check, not enforced here.
      operationId: initiatePinkyPromise
      parameters:
        - name: id
          in: path
          required: true
          description: Conversation id.
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: PinkyPromise created in `pending_b_confirm`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinkyPromise'
        '403':
          description: >
            Caller is the interested user, not the proposer
            (`NOT_INITIATOR`), or not a participant at all
            (`NOT_A_PARTICIPANT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such conversation (`CONVERSATION_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            The conversation is already pinky-promised
            (`ALREADY_PINKY_PROMISED`), has expired (`CONVERSATION_EXPIRED`),
            or already has a live PinkyPromise (`PINKY_PROMISE_EXISTS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pinky-promises/{id}/confirm:
    post:
      tags: [PinkyPromise]
      summary: Confirm a Pinky Promise (B taps back)
      description: >
        Only `user_b_id` of the PinkyPromise may confirm, and only while it
        is `pending_b_confirm`. Enforces the "at most 3 active
        Pinky-Promised events" rule against **both** parties: if either A or
        B already has 3 `confirmed` PinkyPromises whose proposal
        `event_time` is in the future, the request is rejected with
        `PINKY_PROMISE_CAP_REACHED`.


        On success, in one atomic step: this PinkyPromise ->
        `confirmed` (+ `confirmed_at`); its Proposal -> `pinky_promised`;
        its winning Conversation -> `pinky_promised` (which stops its
        expiry); every other still-`active` Conversation on the same
        Proposal -> `expired` (CUJ #4 sibling closure).
      operationId: confirmPinkyPromise
      parameters:
        - name: id
          in: path
          required: true
          description: PinkyPromise id.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PinkyPromise confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinkyPromise'
        '403':
          description: Caller is not `user_b_id` of this PinkyPromise (`NOT_CONFIRMER`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such PinkyPromise (`PINKY_PROMISE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            Not awaiting confirmation (`NOT_PENDING_CONFIRM`), the winning
            conversation has since decayed past its computed expiry
            (`CONVERSATION_EXPIRED`), the event was already promised via
            another conversation (`ALREADY_PINKY_PROMISED`), or a party is
            at the 3-concurrent cap (`PINKY_PROMISE_CAP_REACHED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Caller identity (`user_id`) is derived from the token's `sub` claim.
        Every endpoint in this module operates on the authenticated caller —
        there is no path parameter for user id.

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code of the first violation.
          example: PHOTO_MINIMUM_NOT_MET
        message:
          type: string
          example: At least 6 photos are required.
        details:
          type: array
          description: >
            Every violation found, not just the first — lets a client fix
            all fields in one round trip. Present only on 400 responses that
            can have more than one cause (e.g. profile field validation).
          items:
            type: object
            required: [error, message]
            properties:
              error:
                type: string
              message:
                type: string

    Sex:
      type: string
      enum: [male, female, non_binary, other]

    RelationshipStatus:
      type: string
      enum: [single, married, married_open, married_separated, divorced, widowed]

    Photo:
      type: object
      description: >
        A single profile photo. `id` is stable across edits and is what
        `PATCH /profile/photos`'s `remove` list references — GCS object URLs
        may be signed/rotate, so removal must not rely on exact URL string
        match.
      required: [id, url, position]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          example: https://storage.googleapis.com/pinky-promise-photos/u_123/p_1.jpg
        position:
          type: integer
          minimum: 0
          description: Display order, 0 = primary photo.

    Profile:
      type: object
      required:
        - user_id
        - name
        - sex
        - age
        - need_to_know_text
        - photos
        - verified
        - created_at
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        sex:
          $ref: '#/components/schemas/Sex'
        age:
          type: integer
          minimum: 18
          maximum: 120
        need_to_know_text:
          type: string
          minLength: 1
          maxLength: 500
          description: "\"One thing you absolutely need to know about me.\""
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
          minItems: 6
        occupation:
          type: string
          nullable: true
          maxLength: 100
        relationship_status:
          allOf:
            - $ref: '#/components/schemas/RelationshipStatus'
          nullable: true
        verified:
          type: boolean
          description: Mirrors the decision of the most recent passing Verification.
        created_at:
          type: string
          format: date-time

    ProfileBareView:
      type: object
      description: >
        Fields 1-5 only — see GET /profile/{user_id}. Deliberately a
        separate schema from Profile, not a subset expressed via allOf,
        so it's obvious at the contract level that occupation,
        relationship_status, verified, and created_at are absent here.
      required:
        - user_id
        - name
        - sex
        - age
        - need_to_know_text
        - photos
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        sex:
          $ref: '#/components/schemas/Sex'
        age:
          type: integer
        need_to_know_text:
          type: string
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'

    ProfileUpsertRequest:
      type: object
      required: [name, sex, age, need_to_know_text, photo_urls]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        sex:
          $ref: '#/components/schemas/Sex'
        age:
          type: integer
          minimum: 18
          maximum: 120
        need_to_know_text:
          type: string
          minLength: 1
          maxLength: 500
        photo_urls:
          type: array
          description: >
            Full ordered set of photo URLs (already uploaded to GCS by the
            client beforehand). Must contain at least 6 entries. Order is
            preserved as `position`; index 0 is the primary photo.
          items:
            type: string
            format: uri
          minItems: 6
        occupation:
          type: string
          nullable: true
          maxLength: 100
        relationship_status:
          allOf:
            - $ref: '#/components/schemas/RelationshipStatus'
          nullable: true

    PhotoPatchRequest:
      type: object
      properties:
        add:
          type: array
          description: New photo URLs to append, already uploaded to GCS.
          items:
            type: string
            format: uri
          default: []
        remove:
          type: array
          description: Photo ids (from the current `Profile.photos`) to remove.
          items:
            type: string
            format: uuid
          default: []

    PhotoContentType:
      type: string
      enum: [image/jpeg, image/png, image/webp]
      description: >
        Supported photo formats for upload. HEIC (common on iOS) isn't
        supported yet — the client is expected to convert before
        uploading.

    PhotoUploadUrlRequest:
      type: object
      required: [content_type]
      properties:
        content_type:
          $ref: '#/components/schemas/PhotoContentType'

    PhotoUploadUrlResponse:
      type: object
      required: [upload_url, object_url, expires_at]
      properties:
        upload_url:
          type: string
          format: uri
          description: >
            Signed URL, valid for ~15 minutes. The client's PUT here must
            use a Content-Type header exactly matching the request's
            `content_type` — the signature is bound to that header, so a
            mismatch makes GCS reject the upload.
        object_url:
          type: string
          format: uri
          description: >
            The object's permanent URL, unaffected by `upload_url`'s
            expiry. Once the client confirms the PUT succeeded, this is
            the value to pass to `PUT /profile` (`photo_urls`) or
            `PATCH /profile/photos` (`add`).
        expires_at:
          type: string
          format: date-time
          description: When `upload_url`'s signature expires (~15 minutes from generation).

    VerificationDecision:
      type: string
      enum: [pending, pass, fail]

    Verification:
      type: object
      required: [id, user_id, decision, submitted_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        decision:
          $ref: '#/components/schemas/VerificationDecision'
        liveness_session_id:
          type: string
          nullable: true
          description: Vendor session id for the mobile client's liveness SDK call.
        liveness_score:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 100
        face_match_score:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 100
        submitted_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true

    PaymentType:
      type: string
      enum: [split, host_treats, guest_treats, tbd]
      description: >
        Maps to CUJ #1's "split / I'm treating / we'll figure it out /
        you're treating" — `host_treats` = the creator is treating,
        `guest_treats` = the other party is treating.

    ProposalStatus:
      type: string
      enum: [active, pinky_promised, cancelled, expired]

    RevealableField:
      type: string
      enum: [occupation, relationship_status]
      description: The only two Profile fields a Proposal can choose to reveal.

    Location:
      type: object
      required: [lat, lng, address]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        address:
          type: string
          maxLength: 300

    ProposalCreateRequest:
      type: object
      required: [activity_text, event_time, location, payment_type, looking_for_text]
      properties:
        activity_text:
          type: string
          minLength: 1
          maxLength: 300
          description: "\"I would love to [ ______ ]\""
        event_time:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/Location'
        payment_type:
          $ref: '#/components/schemas/PaymentType'
        looking_for_text:
          type: string
          minLength: 1
          maxLength: 300
          description: "\"I'm looking for someone who [ ______ ] to join me\""
        revealed_fields:
          type: array
          items:
            $ref: '#/components/schemas/RevealableField'
          default: []
          description: Must only name fields the caller's profile has filled in.

    Proposal:
      type: object
      required:
        - id
        - creator_user_id
        - activity_text
        - event_time
        - location
        - payment_type
        - looking_for_text
        - revealed_fields
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        creator_user_id:
          type: string
          format: uuid
        activity_text:
          type: string
        event_time:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/Location'
        payment_type:
          $ref: '#/components/schemas/PaymentType'
        looking_for_text:
          type: string
        revealed_fields:
          type: array
          items:
            $ref: '#/components/schemas/RevealableField'
        status:
          $ref: '#/components/schemas/ProposalStatus'
        created_at:
          type: string
          format: date-time

    ProposalCardCreatorProfile:
      type: object
      description: >
        The subset of the creator's Profile shown on a feed card, computed
        per that specific Proposal's `revealed_fields` (see the entities
        doc's visibility rule). Always includes the required-to-create
        Profile fields (name/sex/age/need_to_know_text/photos);
        `occupation`/`relationship_status` are `null` unless both filled
        in on the creator's profile and revealed on this Proposal.
      required: [name, sex, age, need_to_know_text, photos, occupation, relationship_status]
      properties:
        name:
          type: string
        sex:
          $ref: '#/components/schemas/Sex'
        age:
          type: integer
        need_to_know_text:
          type: string
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        occupation:
          type: string
          nullable: true
        relationship_status:
          allOf:
            - $ref: '#/components/schemas/RelationshipStatus'
          nullable: true

    ProposalFeedItem:
      type: object
      required: [proposal, creator]
      properties:
        proposal:
          $ref: '#/components/schemas/Proposal'
        creator:
          $ref: '#/components/schemas/ProposalCardCreatorProfile'

    ProposalFeedResponse:
      type: object
      required: [proposals]
      properties:
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/ProposalFeedItem'

    SwipeAction:
      type: string
      enum: [interested, pass]
      description: >
        `interested` = Heart (verification-gated, counts toward the
        rolling-24h cap); `pass` = X (always allowed, uncapped).

    SwipeRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/SwipeAction'

    Swipe:
      type: object
      required: [id, proposal_id, action, created_at]
      properties:
        id:
          type: string
          format: uuid
        proposal_id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/SwipeAction'
        created_at:
          type: string
          format: date-time

    ConversationStatus:
      type: string
      enum: [active, pinky_promised, expired]
      description: >
        Stored status. `expired` exists for a future cleanup job only --
        the API's expiry decision is always the COMPUTED `expires_at`, not
        this field.

    MessageType:
      type: string
      enum: [text, voice]

    Conversation:
      type: object
      required:
        - id
        - proposal_id
        - proposer_user_id
        - interested_user_id
        - last_activity_at
        - last_sender_id
        - status
        - created_at
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        proposal_id:
          type: string
          format: uuid
        proposer_user_id:
          type: string
          format: uuid
          description: '"A" -- the proposal''s creator.'
        interested_user_id:
          type: string
          format: uuid
          description: '"B" -- the user who swiped `interested`.'
        last_activity_at:
          type: string
          format: date-time
        last_sender_id:
          type: string
          format: uuid
          nullable: true
          description: Sender of the most recent message; `null` until the first message.
        status:
          $ref: '#/components/schemas/ConversationStatus'
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Server-computed on read (see `GET /conversations`). `null` when
            `status` is `pinky_promised`.

    ConversationListResponse:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'

    MessageRequest:
      type: object
      required: [type, content]
      properties:
        type:
          $ref: '#/components/schemas/MessageType'
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: >
            The message text (for a text message) or the audio object URL
            (for a voice message).

    Message:
      type: object
      required: [id, conversation_id, sender_user_id, type, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender_user_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/MessageType'
        content:
          type: string
          description: Echoes the stored `content_or_url`.
        created_at:
          type: string
          format: date-time

    MessageListResponse:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'

    PinkyPromiseStatus:
      type: string
      enum: [pending_b_confirm, confirmed, cancelled, completed]

    PinkyPromise:
      type: object
      required:
        - id
        - proposal_id
        - conversation_id
        - user_a_id
        - user_b_id
        - status
        - confirmed_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        proposal_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        user_a_id:
          type: string
          format: uuid
          description: The proposer / initiator ("A").
        user_b_id:
          type: string
          format: uuid
          description: The interested user, who confirms ("B").
        status:
          $ref: '#/components/schemas/PinkyPromiseStatus'
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: Set when `status` becomes `confirmed`; `null` before that.
        created_at:
          type: string
          format: date-time
